description: |
  Step to the next palette, wrapping.

  Walks the theme nodes devicetree declared, in order, rather than counting to a
  fixed number — so a palette you added at index 9 is reachable by cycling, and
  a gap in the numbering cannot land on a colour nobody declared.

  Like selecting a palette by index, this works while a block is running: the
  colour is metadata and changing it destroys no elapsed time.

compatible: "zmk,behavior-focus-theme-next"

include: zero_param.yaml
