name: Build

# Every check would otherwise run twice: pushing a branch that has an open PR
# fires both `push` and `pull_request`.
#
# Direct pushes to `main` are blocked by the repository ruleset, so the only
# `push` event left here is the merge commit a PR produces. That build earns its
# place — it is the firmware matching what is actually flashed, and it catches
# two PRs that were each green alone but break once combined. `pull_request`
# covers everything before that, exactly once.
#
# A branch pushed with no PR open does not build. Open the PR, or use the
# workflow_dispatch button.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A ZMK module is only compiled when a keyboard config pulls it in, so CI
  # builds one: reference-config/, a keyless split central. See its README.
  #
  # ZMK's reusable workflow detects that this repo is itself a module and passes
  # the checkout as ZMK_EXTRA_MODULES, building in an isolated workspace. That is
  # what makes the check meaningful: the code under test is this commit, not
  # whatever west would otherwise fetch.
  #
  # `config_path` must stay single-level — ZMK's workflow does a non-recursive
  # mkdir on it, so a nested path such as tests/reference-config fails.
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      build_matrix_path: reference-config/build.yaml
      config_path: reference-config

  # Host tests for logic that needs no target build — see tests/README.md. Runs
  # in seconds on a plain runner, in parallel with the firmware build, so a
  # broken timer rule is caught long before the firmware finishes compiling.
  test:
    runs-on: ubuntu-latest
    steps:
      # v4 ran on Node 20, which the runners now force onto Node 24 and warn
      # about. v5 was the first Node 24 release; v7 is current. v6's breaking
      # change only affects pull_request_target, which this workflow does not
      # use — see the `on:` block above, and the reason it does not.
      - uses: actions/checkout@v7
      - name: Host tests
        run: ./tests/run.sh

  # Single stable check for branch protection. Matrix job names are derived from
  # build.yaml and change whenever a target is added, so pinning required checks
  # to them silently blocks every PR the next time the matrix is edited. This
  # name never changes.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [build, test]
    if: always()
    steps:
      - name: Fail if anything failed
        if: needs.build.result != 'success' || needs.test.result != 'success'
        run: |
          echo "build result: ${{ needs.build.result }}"
          echo "test result:  ${{ needs.test.result }}"
          exit 1
