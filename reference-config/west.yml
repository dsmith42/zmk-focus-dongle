# Deliberately does NOT list this module. ZMK's reusable workflow detects that
# the checked-out repository is itself a module — it has zephyr/module.yml — and
# passes the checkout via ZMK_EXTRA_MODULES, so a pull request is validated
# against its own commit rather than against whatever the branch tip happens to
# be.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config
